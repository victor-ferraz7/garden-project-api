# 7.2 — Dockerização do ambiente: MongoDB + API
# Uso: docker-compose up -d

services:
  mongo:
    image: mongo:7
    container_name: gp-api-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: growapp
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: gp-api
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/growapp
      PORT: "3000"
      # Apenas para desenvolvimento local via Compose — troque em produção
      JWT_ACCESS_SECRET: docker-dev-jwt-access-secret-min-16-chars
      JWT_REFRESH_SECRET: docker-dev-jwt-refresh-secret-min-16-chars
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
